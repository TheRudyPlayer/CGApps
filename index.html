<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CGApps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; color:#111; }

    header { background:white; padding:15px; text-align:center; font-size:22px; font-weight:bold; border-bottom:1px solid #ddd; }

    .search { padding:10px; text-align:center; background:white; }
    .search input { width:90%; padding:10px; border-radius:10px; border:1px solid #ccc; }

    /* GRID RESPONSIVE */
    .container { padding:15px; display:grid; gap:15px; }

    /* PC */
    @media (min-width:900px) {
      .container { grid-template-columns: repeat(4, 1fr); }
    }

    /* Móvil horizontal */
    @media (min-width:600px) and (max-width:899px) {
      .container { grid-template-columns: repeat(3, 1fr); }
    }

    /* Móvil vertical */
    @media (max-width:599px) {
      .container { grid-template-columns: repeat(1, 1fr); }
    }

    .app-card { background:white; padding:10px; border-radius:15px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .app-icon { width:60px; height:60px; border-radius:15px; margin:0 auto 10px; object-fit:cover; }
    .app-name { font-size:16px; font-weight:bold; margin-bottom:4px; }
    .creator { font-size:12px; color:#777; margin-bottom:6px; }
    .version { font-size:12px; color:gray; margin-bottom:6px; }
    .version { font-size:12px; color:gray; margin-bottom:10px; }

    .btn { background:#00cc88; color:white; border:none; padding:8px; border-radius:10px; cursor:pointer; width:100%; font-weight:bold; }
    .btn:hover { background:#00aa70; }

    /* DETALLE */
    .detail { display:none; padding:15px; }
    .detail-box { background:white; border-radius:15px; padding:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .big-icon { width:90px; height:90px; border-radius:20px; object-fit:cover; }
    .rating { color:gold; font-weight:bold; margin:5px 0; }
    .desc { font-size:14px; color:#444; margin:10px 0; }
    .versions { margin-top:10px; }
    .version-item { background:#eee; padding:8px; border-radius:8px; margin:5px 0; font-size:13px; }
    .back { margin-bottom:10px; display:inline-block; cursor:pointer; color:#00aa70; font-weight:bold; }
  </style>
</head>
<body>

<header>CGApps</header>

<div id="home">
  <div class="search">
    <input type="text" placeholder="Buscar apps..." onkeyup="buscarApps(this.value)">
  </div>

  <div class="container" id="apps"></div>
</div>

<div id="detail" class="detail"></div>

<script>
const data = [
  {name:"Chicken Gun", creator:"ChaloApps", version:"5.5.0", rating:"4.5★", desc:"La app original de Juan.", img:"assets/images/ChickenGunLogo.png", apk:"apks/Juan.apk"},
  {name:"Fruzer Gun", creator:"Fruzer", version:"0.6.0", rating:"4.1★", desc:"Versión pro con más funciones.", img:"assets/images/ChickenGunPrivateServerLogo.png", apk:"apks/JuanPro.apk"},
  {name:"Military Chicken Gun", creator:"КУРЫЧ", version:"1.1", rating:"4.0★", desc:"Versión ligera.", img:"assets/images/MilitaryChickenGunLogo.png", apk:"apks/JuanLite.apk"},
  {name:"Chicken Gun Legacy", creator:"TheRudyPlayer", version:"1.0.2", rating:"3.0★", desc:"La más completa.", img:"assets/images/ChickenGunLegacyLogo.png", apk:"apks/JuanMax.apk"},
  {name:"Rooster Gun", creator:"Matvey12K", version:"2.2.03", rating:"4.2★", desc:"Rápida y simple.", img:"assets/images/ChickenGunLogo.png", apk:"apks/JuanGO.apk"},
  {name:"Juan Beta", creator:"RudyDev", version:"0.9", rating:"3.8★", desc:"Versión de prueba.", img:"assets/images/JuanBeta.png", apk:"apks/JuanBeta.apk"}
];

const appsContainer = document.getElementById("apps");

function renderApps() {
  appsContainer.innerHTML = "";
  data.forEach((app,i)=>{
    appsContainer.innerHTML += `
    <div class="app-card">
      <img class="app-icon" src="${app.img}">
      <div class="app-name">${app.name}</div>
      <div class="version">v${app.version}</div>
      <div class="creator">por ${app.creator}</div>
      <button class="btn" onclick="verDetalle(${i})">Descargar</button>
    </div>`;
  });
}

function verDetalle(i) {
  const app = data[i];
  document.getElementById("home").style.display="none";
  const detail = document.getElementById("detail");
  detail.style.display="block";

  detail.innerHTML = `
    <div class="back" onclick="volver()">← Volver</div>
    <div class="detail-box">
      <img class="big-icon" src="${app.img}">
      <h2>${app.name}</h2>
      <div class="creator">Creado por ${app.creator}</div>
      <div class="rating">${app.rating}</div>
      <div class="desc">${app.desc}</div>
      <a href="${app.apk}" download>
        <button class="btn">Descargar última versión (v${app.version})</button>
      </a>
      <div class="versions">
        <h3>Versiones disponibles</h3>
        <div class="version-item">v${app.version}</div>
      </div>
    </div>`;
}

function volver() {
  document.getElementById("detail").style.display="none";
  document.getElementById("home").style.display="block";
}

function buscarApps(texto) {
  texto = texto.toLowerCase();
  const cards = document.querySelectorAll('.app-card');
  cards.forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(texto) ? 'block' : 'none';
  });
}

renderApps();
</script>

</body>
</html>
