<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CGApps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; color:#111; }

    header { background:white; padding:15px; text-align:center; font-size:22px; font-weight:bold; border-bottom:1px solid #ddd; }

    .search { padding:10px; text-align:center; background:white; }
    .search input { width:90%; padding:10px; border-radius:10px; border:1px solid #ccc; }

    .container { padding:15px; display:grid; gap:15px; }

    @media (min-width:900px) { .container { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width:600px) and (max-width:899px) { .container { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width:599px) { .container { grid-template-columns: repeat(1, 1fr); } }

    .app-card { background:white; padding:10px; border-radius:15px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .app-icon { width:60px; height:60px; border-radius:15px; margin:0 auto 10px; object-fit:cover; }
    .app-name { font-size:16px; font-weight:bold; margin-bottom:4px; }
    .creator { font-size:12px; color:#777; margin-bottom:6px; }
    .version { font-size:12px; color:gray; margin-bottom:10px; }

    .btn { background:#00cc88; color:white; border:none; padding:8px; border-radius:10px; cursor:pointer; width:100%; font-weight:bold; }
    .btn:hover { background:#00aa70; }

    .detail { display:none; padding:15px; }
    .detail-box { background:white; border-radius:15px; padding:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .big-icon { width:90px; height:90px; border-radius:20px; object-fit:cover; }
    .rating { color:gold; font-weight:bold; margin:5px 0; }
    .desc { font-size:14px; color:#444; margin:10px 0; }
    .version-item { background:#eee; padding:8px; border-radius:8px; margin:5px 0; font-size:13px; }
    .back { margin-bottom:10px; display:inline-block; cursor:pointer; color:#00aa70; font-weight:bold; }
  </style>
</head>
<body>

<header>CGApps</header>

<div id="home">
  <div class="search">
    <input type="text" placeholder="Buscar apps..." onkeyup="buscarApps(this.value)">
  </div>
  <div class="container" id="apps"></div>
</div>

<div id="detail" class="detail"></div>

<script>
const data = [
  {name:"Chicken Gun", creator:"ChaloApps", version:"5.5.01", rating:"4.5★", desc:"No description.", img:"assets/images/ChickenGunLogo.png", link:"https://www.mediafire.com/file/ue39egs2cobil57/Chicken-Gun-5_5_01.xapk/file", versions:["5.5.01","5.5.0","5.4.03"]},
  {name:"Fruzer Gun", creator:"Fruzer", version:"0.6.0", rating:"4.1★", desc:"No description.", img:"assets/images/ChickenGunPrivateServerLogo.png", link:"https://www.youtube.com", versions:["2.3","2.2","2.1"]},
  {name:"Military Chicken Gun", creator:"КУРЫЧ", version:"0.5", rating:"4.0★", desc:"No description.", img:"assets/images/MilitaryChickenGunLogo.png", link:"https://www.wikipedia.org", versions:["0.5","0.4"]},
  {name:"Chicken Gun Legacy", creator:"TheRudyPlayer", version:"1.0.2", rating:"3.0★", desc:"Chicken Gun Legacy is a Chicken Gun modification with the maps, skins, data, and features removed from this game.", img:"assets/images/ChickenGunLegacyLogo.png", link:"https://www.bing.com", versions:["3.0","2.9"]},
  {name:"Rooster Gun", creator:"Matvey12K", version:"2.2.03", rating:"4.2★", desc:"No description.", img:"assets/images/ChickenGunLogo.png", link:"https://www.twitter.com", versions:["1.5","1.4"]},
  {name:"Chicken Gun Windows Port", creator:"Nonogamer9", version:"1.4.6", rating:"3.8★", desc:"It's a port of Chicken Gun for computer devices, it has an RTX version and even Chicken Gun fan games.", img:"assets/images/JuanBeta.png", link:"https://www.github.com", versions:["0.9","0.8"]}
];

const appsContainer = document.getElementById("apps");

function renderApps() {
  appsContainer.innerHTML = "";
  data.forEach((app,i)=>{
    appsContainer.innerHTML += `
    <div class="app-card">
      <img class="app-icon" src="${app.img}">
      <div class="app-name">${app.name}</div>
      <div class="version">v${app.version}</div>
      <div class="creator">por ${app.creator}</div>
      <button class="btn" onclick="verDetalle(${i})">Descargar</button>
    </div>`;
  });
}

function verDetalle(i) {
  const app = data[i];
  document.getElementById("home").style.display="none";
  const detail = document.getElementById("detail");
  detail.style.display="block";

  detail.innerHTML = `
    <div class="back" onclick="volver()">← Volver</div>
    <div class="detail-box">
      <img class="big-icon" src="${app.img}">
      <h2>${app.name}</h2>
      <div class="creator">Creado por ${app.creator}</div>
      <div class="rating">${app.rating}</div>
      <div class="desc">${app.desc}</div>
      <button class="btn" onclick="window.open('${app.link}','_blank')">Descargar última versión (v${app.version})</button>
      <div class="versions">
        <h3>Versiones disponibles</h3>
        ${app.versions.map(v => `<div class="version-item">v${v}</div>`).join('')}
      </div>
    </div>`;
}

function volver() {
  document.getElementById("detail").style.display="none";
  document.getElementById("home").style.display="block";
}

function buscarApps(texto) {
  texto = texto.toLowerCase();
  document.querySelectorAll('.app-card').forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(texto) ? 'block' : 'none';
  });
}

renderApps();
</script>

</body>
</html>
